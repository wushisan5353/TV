name: API Sweep 234

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fongmi
        uses: actions/checkout@v4
        with:
          ref: fongmi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: pip install -q requests
      - name: Run API sweep
        run: python3 apisweep.py
      - name: Commit sweep output
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apisweep-out
          git commit -m "api sweep results" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin fongmi || true
            git push origin HEAD:fongmi && break
            echo "push retry $i"
            sleep 5
          done
