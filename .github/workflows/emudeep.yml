name: Emulator Deep Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deep:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preflight, boot redroid, install
        run: |
          mkdir -p deep-out
          exec > >(tee -a deep-out/runlog.txt) 2>&1
          echo "=== uname ==="; uname -a
          sudo apt-get update -qq
          sudo apt-get install -y android-tools-adb
          if ! command -v adb; then echo "ADB_MISSING" > deep-out/PREFLIGHT_FAIL.txt; exit 1; fi
          adb version
          echo "=== binder ladder ==="
          zgrep CONFIG_ANDROID_BINDER_IPC /proc/config.gz 2>/dev/null || grep CONFIG_ANDROID_BINDER_IPC /boot/config-$(uname -r) 2>/dev/null || echo "no kernel config visible"
          BINDER=""
          if sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then BINDER=direct; fi
          if [ -z "$BINDER" ]; then
            sudo apt-get install -y linux-modules-extra-$(uname -r) || sudo apt-get install -y linux-modules-extra-azure || sudo apt-get install -y linux-modules-extra || true
            if sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then BINDER=after-install; fi
          fi
          if [ -n "$BINDER" ]; then echo "BINDER_OK via $BINDER"; else echo "BINDER_FAIL" > deep-out/PREFLIGHT_FAIL.txt; exit 1; fi
          ls -l /dev/binder* 2>/dev/null || true
          docker run -d --privileged -p 5555:5555 --name redroid redroid/redroid:11.0.0-latest androidboot.redroid_gpu_mode=guest
          docker ps
          adb connect localhost:5555
          BOOT=""
          for i in $(seq 1 40); do
            B=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "boot try $i: $B"
            if [ "$B" = "1" ]; then BOOT=ok; break; fi
            sleep 10
          done
          if [ "$BOOT" != "ok" ]; then echo "BOOT_FAIL" > deep-out/PREFLIGHT_FAIL.txt; exit 1; fi
          adb -s localhost:5555 shell getprop ro.product.cpu.abilist
          curl -sL -o tvmax.apk "https://github.com/wushisan5353/TV/releases/download/tvmax-box-3.1/TVMax-Box-3.1-armeabi_v7a.apk"
          adb -s localhost:5555 install -r tvmax.apk && echo INSTALL_OK || { echo "INSTALL_FAIL" > deep-out/PREFLIGHT_FAIL.txt; exit 1; }
          adb -s localhost:5555 logcat -c
          echo PREFLIGHT_OK
