          echo "cCgzKQogICAgbG9nKCdPRkZJQ0lBTF9TTklGRl9FTkdBR0VEOiAnICsgKCdZRVMnIGlmIGVuZ2FnZWQgZWxzZSAnTk8nKSkKICAg" >> deep.b64
          echo "IGxvZygnT0ZGSUNJQUxfU1RSRUFNX1BMQVlJTkc6ICcgKyAoJ1lFUycgaWYgcGxheWluZyBlbHNlICdOTycpKQoKbG9nKCdjcmFz" >> deep.b64
