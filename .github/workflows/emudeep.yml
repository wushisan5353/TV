name: Emulator Deep Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deep:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Boot redroid, install, deep drive
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" && echo BINDER_OK
          docker run -d --privileged -p 5555:5555 --name redroid redroid/redroid:11.0.0-latest androidboot.redroid_gpu_mode=guest
          adb connect localhost:5555
          for i in $(seq 1 40); do
            B=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && break
            sleep 10
          done
          adb -s localhost:5555 shell getprop ro.product.cpu.abilist
          curl -sL -o tvmax.apk "https://github.com/wushisan5353/TV/releases/download/tvmax-box-2.4/TVMax-Box-2.4-armeabi_v7a.apk"
          adb -s localhost:5555 install -r tvmax.apk && echo INSTALL_OK
          adb -s localhost:5555 logcat -c
          rm -f deep.b64
          echo "aW1wb3J0IHN1YnByb2Nlc3MsIHRpbWUsIHJlLCBzeXMsIG9zCmltcG9ydCB4bWwuZXRyZWUuRWxlbWVudFRyZWUgYXMgRVQKClMg" >> deep.b64
