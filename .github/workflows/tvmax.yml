name: TV Max Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download v9 APK (release tvmax-1.1)
        run: |
          curl -sL -o tvmax.apk "https://github.com/wushisan5353/TV/releases/download/tvmax-1.1/TVMax-4.0.7-armeabi_v7a.apk"
          ls -lh tvmax.apk

      - name: Emulator diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: diag
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p diag-out
            echo "=== install ===" > diag-out/steps.log
            adb install -r tvmax.apk >> diag-out/steps.log 2>&1 || adb install --abi armeabi-v7a -r tvmax.apk >> diag-out/steps.log 2>&1 || echo INSTALL_FAILED >> diag-out/steps.log
            adb root || true
            sleep 3
            adb logcat -c || true
            adb logcat > diag-out/logcat.txt &
            LOGPID=$!
            echo "=== launch 1 ===" >> diag-out/steps.log
            adb shell am start -n com.wushisan.tvmax/com.fongmi.android.tv.ui.activity.HomeActivity >> diag-out/steps.log 2>&1 || true
            sleep 60
            adb exec-out screencap -p > diag-out/home1.png || true
            adb shell uiautomator dump /sdcard/home1.xml || true
            adb pull /sdcard/home1.xml diag-out/home1.xml || true
            echo "=== db inspect + seed douban home ===" >> diag-out/steps.log
            adb shell am force-stop com.wushisan.tvmax || true
            sleep 2
            adb shell "sqlite3 /data/data/com.wushisan.tvmax/databases/tv 'SELECT id,type,name,url,home FROM Config;'" > diag-out/db-before.txt 2>&1 || true
            adb shell "sqlite3 /data/data/com.wushisan.tvmax/databases/tv \"UPDATE Config SET home='csp_douban' WHERE type=0;\"" >> diag-out/steps.log 2>&1 || true
            adb shell "sqlite3 /data/data/com.wushisan.tvmax/databases/tv 'SELECT id,type,name,home FROM Config;'" > diag-out/db-after.txt 2>&1 || true
            echo "=== launch 2 (douban home) ===" >> diag-out/steps.log
            adb shell am start -n com.wushisan.tvmax/com.fongmi.android.tv.ui.activity.HomeActivity >> diag-out/steps.log 2>&1 || true
            sleep 45
            adb exec-out screencap -p > diag-out/home2.png || true
            adb shell uiautomator dump /sdcard/home2.xml || true
            adb pull /sdcard/home2.xml diag-out/home2.xml || true
            echo "=== navigate to first recommendation ===" >> diag-out/steps.log
            adb shell input keyevent 20 || true
            sleep 1
            adb shell input keyevent 20 || true
            sleep 1
            adb exec-out screencap -p > diag-out/focus.png || true
            adb shell input keyevent 23 || true
            sleep 25
            adb exec-out screencap -p > diag-out/detail1.png || true
            adb shell uiautomator dump /sdcard/detail1.xml || true
            adb pull /sdcard/detail1.xml diag-out/detail1.xml || true
            sleep 15
            adb exec-out screencap -p > diag-out/detail2.png || true
            adb shell dumpsys activity activities > diag-out/activities.txt 2>&1 || true
            kill $LOGPID || true
            echo "=== done ===" >> diag-out/steps.log
            ls -lh diag-out/ >> diag-out/steps.log 2>&1 || true

      - name: Commit diagnostics to repo
        if: always()
        run: |
          git config user.email "diag@ci.local"
          git config user.name "tvmax-diag"
          git add diag-out || true
          git commit -m "diag: cloud emulator run" || true
          git push origin HEAD:fongmi || true
          ls -lh diag-out || true
