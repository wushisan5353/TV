name: Build TV Max Box

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (this repo, for log commits)
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.10 (for Chaquo build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;30.0.3" > /dev/null
          ls $ANDROID_HOME/build-tools

      - name: Checkout takagen99/Box base
        uses: actions/checkout@v4
        with:
          repository: takagen99/Box
          ref: 258a5fef61578869ae905ca230bdde9e99fc19a8
          path: src

      - name: Apply TV Max patches
        env:
          PYLOC: ${{ env.pythonLocation }}
        run: |
          python3 - <<'PY'
          import pathlib, os
          root = pathlib.Path('src')

          def patch(rel, old, new, count=1):
              p = root / rel
              t = p.read_text(encoding='utf-8')
              assert t.count(old) >= 1, f'anchor missing in {rel}: {old[:60]!r}'
              p.write_text(t.replace(old, new, count), encoding='utf-8')
              print('patched', rel)

          # 1) App name + built-in default config (Laoliu: 234 sites incl. cloud-drive/magnet + lives + dark wallpaper)
          patch('app/src/main/res/values/strings.xml',
                '<string name="app_name">TVBox</string>',
                '<string name="app_name">TV Max</string>')
          patch('app/src/main/res/values/strings.xml',
                '<string name="app_source"></string>',
                '<string name="app_source">https://raw.githubusercontent.com/wushisan5353/TV/fongmi/tvmax-config.json</string>')
          # values-zh overrides values on Chinese-locale devices; seed it too (empty there = no sources)
          patch('app/src/main/res/values-zh/strings.xml',
                '<string name="app_name">TVBox</string>',
                '<string name="app_name">TV Max</string>')
          patch('app/src/main/res/values-zh/strings.xml',
                '<string name="app_source"></string>',
                '<string name="app_source">https://raw.githubusercontent.com/wushisan5353/TV/fongmi/tvmax-config.json</string>')

          # 2) Own applicationId + fixed version
          patch('app/build.gradle',
                "applicationId 'com.github.tvbox.osc.tk'",
                "applicationId 'com.wushisan.tvmax'")
          patch('app/build.gradle',
                'versionCode 1',
                'versionCode 205')
          patch('app/build.gradle',
                'versionName "1.0.".concat(buildTime())',
                'versionName "2.5"')

          # 2a) First-run presets (App.java putDefault seeds): Douban home feed, Exo player, no window preview
          patch('app/src/main/java/com/github/tvbox/osc/base/App.java',
                'putDefault(HawkConfig.HOME_REC, 1);',
                'putDefault(HawkConfig.HOME_REC, 0);')
          patch('app/src/main/java/com/github/tvbox/osc/base/App.java',
                'putDefault(HawkConfig.SHOW_PREVIEW, true);',
                'putDefault(HawkConfig.SHOW_PREVIEW, false);')
          patch('app/src/main/java/com/github/tvbox/osc/base/App.java',
                'putDefault(HawkConfig.PLAY_TYPE, 1);',
                'putDefault(HawkConfig.PLAY_TYPE, 2);')
          patch('app/src/main/java/com/github/tvbox/osc/base/App.java',
                'putDefault(HawkConfig.IJK_CODEC,',
                'putDefault(HawkConfig.LIVE_PLAYER_TYPE, 2);                  // live player: Exo\n        putDefault(HawkConfig.IJK_CODEC,')

          # 2f) 2.5: fast search mode default on (categorized source-list results, keshimax-style)
          patch('app/src/main/java/com/github/tvbox/osc/base/App.java',
                'putDefault(HawkConfig.HOME_NUM, 4);',
                'putDefault(HawkConfig.HOME_NUM, 4);\n        putDefault(HawkConfig.FAST_SEARCH_MODE, true);')

          # 2c) Apple TV theme (index 7): accent ramp in styles.xml + wiring in BaseActivity/settings/App seed
          patch('app/src/main/res/values/styles.xml',
                '</style>\n\n    <!-- 自定义dialog样式 -->',
                '</style>\n\n    <style name="AppleTheme" parent="AppTheme.NoActionBar">\n        <item name="color_theme">#0A84FF</item>\n        <item name="color_theme_80">#CC0A84FF</item>\n        <item name="color_theme_70">#B30A84FF</item>\n        <item name="color_theme_60">#990A84FF</item>\n        <item name="color_theme_50">#800A84FF</item>\n        <item name="color_theme_40">#660A84FF</item>\n        <item name="color_theme_dark_70">#B3054A8C</item>\n    </style>\n\n    <!-- 自定义dialog样式 -->')
          patch('app/src/main/java/com/github/tvbox/osc/base/BaseActivity.java',
                '        } else if (Hawk.get(HawkConfig.THEME_SELECT, 0) == 5) {\n            setTheme(R.style.YagamiTheme);\n        } else {\n            setTheme(R.style.SakuraTheme);\n        }',
                '        } else if (Hawk.get(HawkConfig.THEME_SELECT, 0) == 5) {\n            setTheme(R.style.YagamiTheme);\n        } else if (Hawk.get(HawkConfig.THEME_SELECT, 0) == 6) {\n            setTheme(R.style.SakuraTheme);\n        } else {\n            setTheme(R.style.AppleTheme);\n        }')
          patch('app/src/main/java/com/github/tvbox/osc/ui/fragment/ModelSettingFragment.java',
                '                types.add(6);',
                '                types.add(6);\n                types.add(7);')
          patch('app/src/main/java/com/github/tvbox/osc/ui/fragment/ModelSettingFragment.java',
                '        } else if (type == 5) {\n            return "八神";\n        } else {\n            return "樱花";\n        }',
                '        } else if (type == 5) {\n            return "八神";\n        } else if (type == 6) {\n            return "樱花";\n        } else {\n            return "Apple TV";\n        }')
          patch('app/src/main/java/com/github/tvbox/osc/base/App.java',
                'putDefault(HawkConfig.THEME_SELECT, 0);',
                'putDefault(HawkConfig.THEME_SELECT, 7);')

          # 2d) 2.2: upgrade migration + home card polish + wallpaper picker
          patch('app/src/main/java/com/github/tvbox/osc/base/App.java',
                'putDefault(HawkConfig.DOH_URL, 0);',
                'putDefault(HawkConfig.DOH_URL, 0);\n\n        // TV Max: one-time 2.2 migration so upgrade installs also get the new defaults\n        if (!Hawk.contains("tvmax_22_migrated")) {\n            Hawk.put(HawkConfig.THEME_SELECT, 7);\n            Hawk.put(HawkConfig.HOME_REC, 0);\n            Hawk.put(HawkConfig.PLAY_TYPE, 2);\n            Hawk.put(HawkConfig.LIVE_PLAYER_TYPE, 2);\n            Hawk.put(HawkConfig.SHOW_PREVIEW, false);\n            Hawk.put("tvmax_22_migrated", true);\n        }')
          patch('app/src/main/res/drawable/shape_thumb_radius.xml',
                'android:radius="14px"',
                'android:radius="30px"', 2)
          patch('app/src/main/res/drawable/shape_thumb_radius.xml',
                'android:width="2mm"',
                'android:width="1.2mm"')
          patch('app/src/main/res/drawable/shape_thumb_bottom_name.xml',
                '    <corners\n        android:bottomLeftRadius="@dimen/vs_14"\n        android:bottomRightRadius="@dimen/vs_14" />\n    <solid android:color="@color/color_000000_60" />',
                '    <corners\n        android:bottomLeftRadius="@dimen/vs_20"\n        android:bottomRightRadius="@dimen/vs_20" />\n    <gradient\n        android:angle="270"\n        android:startColor="#00000000"\n        android:endColor="#CC000000"\n        android:type="linear" />')
          patch('app/src/main/res/layout/item_grid.xml',
                'android:scaleType="fitXY"',
                'android:scaleType="centerCrop"')
          patch('app/src/main/java/com/github/tvbox/osc/ui/fragment/ModelSettingFragment.java',
                '        findViewById(R.id.llWp).setOnClickListener(new View.OnClickListener() {\n            @Override\n            public void onClick(View v) {\n                FastClickCheckUtil.check(v);\n                if (!ApiConfig.get().wallpaper.isEmpty())\n                    Toast.makeText(mContext, getString(R.string.mn_wall_load), Toast.LENGTH_SHORT).show();\n                OkGo.<File>get(ApiConfig.get().wallpaper).execute(new FileCallback(requireActivity().getFilesDir().getAbsolutePath(), "wp") {\n                    @Override\n                    public void onSuccess(Response<File> response) {\n                        ((BaseActivity) requireActivity()).changeWallpaper(true);\n                    }\n\n                    @Override\n                    public void onError(Response<File> response) {\n                        super.onError(response);\n                    }\n\n                    @Override\n                    public void downloadProgress(Progress progress) {\n                        super.downloadProgress(progress);\n                    }\n                });\n            }\n        });',
                '        findViewById(R.id.llWp).setOnClickListener(new View.OnClickListener() {\n            @Override\n            public void onClick(View v) {\n                FastClickCheckUtil.check(v);\n                final String[] wpNames = {"云端推荐", "近黑", "深海军蓝", "深空灰紫", "暗酒红", "墨绿"};\n                final String[] wpUrls = {ApiConfig.get().wallpaper,\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-black.jpg",\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-navy.jpg",\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-violet.jpg",\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-wine.jpg",\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-fern.jpg"};\n                ArrayList<Integer> types = new ArrayList<>();\n                for (int i = 0; i < wpNames.length; i++) types.add(i);\n                SelectDialog<Integer> dialog = new SelectDialog<>(mActivity);\n                dialog.setTip("选择壁纸");\n                dialog.setAdapter(null, new SelectDialogAdapter.SelectDialogInterface<Integer>() {\n                    @Override\n                    public void click(Integer value, int pos) {\n                        String url = wpUrls[value];\n                        if (url == null || url.isEmpty()) return;\n                        Toast.makeText(mContext, getString(R.string.mn_wall_load), Toast.LENGTH_SHORT).show();\n                        OkGo.<File>get(url).execute(new FileCallback(requireActivity().getFilesDir().getAbsolutePath(), "wp") {\n                            @Override\n                            public void onSuccess(Response<File> response) {\n                                ((BaseActivity) requireActivity()).changeWallpaper(true);\n                            }\n\n                            @Override\n                            public void onError(Response<File> response) {\n                                super.onError(response);\n                            }\n                        });\n                    }\n\n                    @Override\n                    public String getDisplay(Integer val) {\n                        return wpNames[val];\n                    }\n                }, new DiffUtil.ItemCallback<Integer>() {\n                    @Override\n                    public boolean areItemsTheSame(@NonNull @NotNull Integer oldItem, @NonNull @NotNull Integer newItem) {\n                        return oldItem.intValue() == newItem.intValue();\n                    }\n\n                    @Override\n                    public boolean areContentsTheSame(@NonNull @NotNull Integer oldItem, @NonNull @NotNull Integer newItem) {\n                        return oldItem.intValue() == newItem.intValue();\n                    }\n                }, types, 0);\n                dialog.show();\n            }\n        });')

          # 2b) Repo order: official google/mavenCentral first, aliyun mirror as fallback (mirror had a 502 outage)
          bg = root / 'build.gradle'
          bt = bg.read_text(encoding='utf-8')
          old_repo = 'repositories {\n        maven { url "https://maven.aliyun.com/repository/public" }'
          new_repo = 'repositories {\n        google()\n        mavenCentral()\n        maven { url "https://maven.aliyun.com/repository/public" }'
          assert bt.count(old_repo) == 2, f'repo anchor count={bt.count(old_repo)}'
          bg.write_text(bt.replace(old_repo, new_repo), encoding='utf-8')
          print('patched build.gradle repo order')

          # 3) Chaquo: host python path + pin pip packages (chaquo py3.8 index caps cssselect at 1.2.0)
          pyloc = os.environ.get('PYLOC', '')
          pybin = (pyloc + '/bin/python') if pyloc else 'python3'
          patch('pyramid/build.gradle',
                'buildPython("D:/Programs/Python/Python38/python.exe")',
                'buildPython("%s")' % pybin)
          patch('pyramid/build.gradle',
                'install "pyquery"',
                'install "pyquery==2.0.0"\n                install "cssselect==1.2.0"')
          # 2e) 2.3/2.4: wallpaper gallery +4, settings text follows theme, tvOS focus motion
          patch('app/src/main/java/com/github/tvbox/osc/ui/fragment/ModelSettingFragment.java',
                'final String[] wpNames = {"云端推荐", "近黑", "深海军蓝", "深空灰紫", "暗酒红", "墨绿"};',
                'final String[] wpNames = {"云端推荐", "近黑", "深海军蓝", "深空灰紫", "暗酒红", "墨绿", "城市夜航", "海洋", "云海", "雾岭"};')
          patch('app/src/main/java/com/github/tvbox/osc/ui/fragment/ModelSettingFragment.java',
                '"https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-fern.jpg"};',
                '"https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-fern.jpg",\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-city.jpg",\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-ocean.jpg",\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-clouds.jpg",\n                        "https://raw.githubusercontent.com/wushisan5353/TV/fongmi/wp-mist.jpg"};')
          patch('app/src/main/res/layout/fragment_model.xml',
                'android:textColor="@android:color/white"',
                'android:textColor="?attr/color_theme"', 77)
          patch('app/src/main/java/com/github/tvbox/osc/ui/fragment/GridFragment.java',
                'import android.view.animation.BounceInterpolator;',
                'import android.view.animation.BounceInterpolator;\nimport android.view.animation.DecelerateInterpolator;')
          patch('app/src/main/java/com/github/tvbox/osc/ui/fragment/GridFragment.java',
                'itemView.animate().scaleX(1.0f).scaleY(1.0f).setDuration(300).setInterpolator(new BounceInterpolator()).start();',
                'itemView.animate().scaleX(1.0f).scaleY(1.0f).setDuration(220).setInterpolator(new DecelerateInterpolator()).start();')
          patch('app/src/main/java/com/github/tvbox/osc/ui/fragment/GridFragment.java',
                'itemView.animate().scaleX(1.2f).scaleY(1.2f).setDuration(300).setInterpolator(new BounceInterpolator()).start();',
                'itemView.animate().scaleX(1.08f).scaleY(1.08f).setDuration(220).setInterpolator(new DecelerateInterpolator()).start();')
          patch('app/src/main/res/drawable/shape_thumb_radius.xml',
                '?attr/color_theme_40',
                '?attr/color_theme_50')
          print('all patches applied, buildPython =', pybin)
          PY

      - name: Use colorful cube icon (from FongMi build, user pick)
        run: |
          curl -sL --retry 3 -o src/app/src/main/res/drawable/app_icon.png "https://raw.githubusercontent.com/FongMi/TV/f08d0740/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          python3 -c "from PIL import Image; im=Image.open('src/app/src/main/res/drawable/app_icon.png'); print('icon:', im.size)" 2>/dev/null || file src/app/src/main/res/drawable/app_icon.png
          test -s src/app/src/main/res/drawable/app_icon.png

      - name: Gradle build (armeabi generic python release)
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties
          cat src/local.properties
          cd src
          chmod +x gradlew
          ./gradlew :app:assembleArmeabiGenericNormalRelease --no-daemon --stacktrace 2>&1 | tee ../build-full.log | tail -40
          find app/build/outputs -name '*.apk' | grep . || { echo 'NO APK PRODUCED'; exit 1; }

      - name: Sign APK
        run: |
          {
          set -x
          find src/app/build/outputs -name '*.apk' > apk-list.txt 2>&1 || true
          cat apk-list.txt || true
          echo "${{ secrets.TVMAX_KEYSTORE_B64 }}" | base64 -d > tvmax.p12
          PASS="${{ secrets.TVMAX_KEYSTORE_PASS }}"
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          echo "build-tools: $BT"
          UNSIGNED=$(grep -i 'release' apk-list.txt | head -1)
          if [ -z "$UNSIGNED" ]; then UNSIGNED=$(head -1 apk-list.txt); fi
          echo "unsigned: $UNSIGNED"
          $ANDROID_HOME/build-tools/$BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks tvmax.p12 --ks-type PKCS12 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out TVMax-Box-2.5-armeabi_v7a.apk aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs TVMax-Box-2.5-armeabi_v7a.apk | head -2
          $ANDROID_HOME/build-tools/$BT/aapt dump badging TVMax-Box-2.5-armeabi_v7a.apk | grep -E "package:|sdkVersion|native-code" || true
          ls -lh TVMax-Box-2.5-armeabi_v7a.apk
          } 2>&1 | tee sign.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVMaxBox-apk
          path: TVMax-Box-2.5-armeabi_v7a.apk

      - name: Dump build log to repo (always)
        if: always()
        run: |
          { [ -f build-full.log ] && tail -n 600 build-full.log; [ -f apk-list.txt ] && echo '=== APK LIST ===' && cat apk-list.txt; [ -f sign.log ] && echo '=== SIGN LOG ===' && cat sign.log; } > build-log.txt 2>/dev/null || true
          if [ -s build-log.txt ]; then
            { echo '## Box build log tail'; echo '```'; cat build-log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
            git config user.email "ci@tvmax.local" || true
            git config user.name "tvmax-ci" || true
            git add build-log.txt || true
            git commit -m "ci: box build log" || true
            git pull --rebase origin fongmi || true
            git push origin HEAD:fongmi || true
          fi

  verify:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TVMaxBox-apk

      - name: redroid gate (native install + launch + crash check)
        run: |
          mkdir -p verify-out
          exec > >(tee -a verify-out/runlog.txt) 2>&1
          set +e
          uname -a
          sudo apt-get update -qq
          sudo apt-get install -y android-tools-adb
          if ! command -v adb; then echo "GATE_FAIL adb missing"; exit 1; fi
          BINDER=""
          if sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then BINDER=direct; fi
          if [ -z "$BINDER" ]; then
            sudo apt-get install -y linux-modules-extra-$(uname -r) || sudo apt-get install -y linux-modules-extra-azure || sudo apt-get install -y linux-modules-extra || true
            if sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then BINDER=after-install; fi
          fi
          if [ -n "$BINDER" ]; then echo "BINDER_OK via $BINDER"; else echo "GATE_FAIL binder"; exit 1; fi
          docker run -d --privileged -p 5555:5555 --name redroid redroid/redroid:11.0.0-latest androidboot.redroid_gpu_mode=guest
          docker ps
          adb connect localhost:5555
          BOOT=""
          for i in $(seq 1 40); do
            B=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "boot try $i: $B"
            if [ "$B" = "1" ]; then BOOT=ok; break; fi
            sleep 10
          done
          if [ "$BOOT" != "ok" ]; then echo "GATE_FAIL boot"; exit 1; fi
          adb -s localhost:5555 shell getprop ro.product.cpu.abilist
          adb -s localhost:5555 install -r TVMax-Box-2.5-armeabi_v7a.apk && echo INSTALL_OK || { echo "GATE_FAIL install"; exit 1; }
          adb -s localhost:5555 logcat -c
          adb -s localhost:5555 shell am start -n com.wushisan.tvmax/com.github.tvbox.osc.ui.activity.HomeActivity
          sleep 45
          adb -s localhost:5555 exec-out screencap -p > verify-out/home.png
          adb -s localhost:5555 shell dumpsys activity activities > verify-out/activities.txt 2>&1
          adb -s localhost:5555 logcat -b crash -d > verify-out/crash.txt 2>&1
          adb -s localhost:5555 shell uiautomator dump /sdcard/home.xml
          adb -s localhost:5555 pull /sdcard/home.xml verify-out/home.xml || true
          ls -lh verify-out/
          grep -q "HomeActivity" verify-out/activities.txt || { echo "GATE_FAIL top activity"; exit 1; }
          if grep -q "com.wushisan.tvmax" verify-out/crash.txt; then echo "GATE_FAIL crash mentions tvmax"; exit 1; fi
          echo GATE_PASS

      - name: Commit verify output
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add verify-out
          git commit -m "redroid gate output" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin fongmi || true
            git push origin HEAD:fongmi && break
            echo "push retry $i"
            sleep 5
          done

  release:
    needs: [build, verify]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TVMaxBox-apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tvmax-box-2.5
          name: "TV Max Box 2.5"
          body: |
            TV Max 2.0：基于 takagen99/Box (TVBoxOSC 系, minSdk 21, 兼容 Android 5.1)
            - 改名 TV Max, 独立包名 com.wushisan.tvmax, 版本号 2.0
            - 内置默认配置: 自托管云端配置 (240+ 站, 每周自动维护: 同步/验活/加新站), 直播单源分组列表 (央视卫视/港澳台/欧洲/国际等 3000+ 频道), 深色壁纸
            - 开箱预设: 默认豆瓣首页推荐, 播放器 Exo + 硬解, 关闭窗口预览 (针对老电视性能优化)
            - 新增 Apple TV 主题 (系统蓝强调色, 已设为默认, 设置-主题里可切换其余 7 款)
            - 2.2: 首页海报卡打磨 (大圆角/渐变片名条/居中裁剪); 壁纸改为内置图库选择 (6 款); 升级安装自动应用新默认 (一次性迁移)
            - 2.3: 壁纸图库扩到 10 款 (新增城市夜航/海洋/云海/雾岭); 设置与首页文字颜色随主题同步; 海报焦点动画改顺滑放大
            - 2.4: 首页文字颜色改回中性白 (整排主题色太跳); 设置页文字随主题同步保留
            - 2.5: 搜索默认进分类结果页 (左侧按源筛选的可视式布局, 设置里可关回); 固定签名 (本版需最后卸载装一次, 此后可直接覆盖安装); 发布验证改为 ARM 云端真机级把关
            - armeabi-v7a (32 位), 适配暴风 TV (Amlogic T962 / Android 5.1 / 2G 内存)
          files: TVMax-Box-2.5-armeabi_v7a.apk
