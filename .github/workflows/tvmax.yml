name: Build TV Max Box

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (this repo, for log commits)
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.10 (for Chaquo build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;30.0.3" > /dev/null
          ls $ANDROID_HOME/build-tools

      - name: Checkout takagen99/Box base
        uses: actions/checkout@v4
        with:
          repository: takagen99/Box
          ref: 258a5fef61578869ae905ca230bdde9e99fc19a8
          path: src

      - name: Apply TV Max patches
        env:
          PYLOC: ${{ env.pythonLocation }}
        run: |
          python3 - <<'PY'
          import pathlib, os
          root = pathlib.Path('src')

          def patch(rel, old, new, count=1):
              p = root / rel
              t = p.read_text(encoding='utf-8')
              assert t.count(old) >= 1, f'anchor missing in {rel}: {old[:60]!r}'
              p.write_text(t.replace(old, new, count), encoding='utf-8')
              print('patched', rel)

          # 1) App name + built-in default config (Laoliu: 234 sites incl. cloud-drive/magnet + lives + dark wallpaper)
          patch('app/src/main/res/values/strings.xml',
                '<string name="app_name">TVBox</string>',
                '<string name="app_name">TV Max</string>')
          patch('app/src/main/res/values/strings.xml',
                '<string name="app_source"></string>',
                '<string name="app_source">https://raw.liucn.cc/box/m.json</string>')

          # 2) Own applicationId + fixed version
          patch('app/build.gradle',
                "applicationId 'com.github.tvbox.osc.tk'",
                "applicationId 'com.wushisan.tvmax'")
          patch('app/build.gradle',
                'versionCode 1',
                'versionCode 101')
          patch('app/build.gradle',
                'versionName "1.0.".concat(buildTime())',
                'versionName "1.0-box1"')

          # 3) Chaquo: host python path + pin pip packages (chaquo py3.8 index caps cssselect at 1.2.0)
          pyloc = os.environ.get('PYLOC', '')
          pybin = (pyloc + '/bin/python') if pyloc else 'python3'
          patch('pyramid/build.gradle',
                'buildPython("D:/Programs/Python/Python38/python.exe")',
                'buildPython("%s")' % pybin)
          patch('pyramid/build.gradle',
                'install "pyquery"',
                'install "pyquery==2.0.0"\n                install "cssselect==1.2.0"')
          print('all patches applied, buildPython =', pybin)
          PY

      - name: Gradle build (armeabi generic python release)
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties
          cat src/local.properties
          cd src
          chmod +x gradlew
          ./gradlew :app:assembleArmeabiGenericPythonRelease --no-daemon --stacktrace 2>&1 | tee ../build-full.log | tail -40
          find app/build/outputs -name '*.apk' | grep . || { echo 'NO APK PRODUCED'; exit 1; }

      - name: Sign APK
        run: |
          {
          set -x
          find src/app/build/outputs -name '*.apk' > apk-list.txt 2>&1 || true
          cat apk-list.txt || true
          PASS=$(openssl rand -hex 8)
          keytool -genkeypair -keystore tvmax.jks -alias tvmax -keyalg RSA -keysize 2048 -validity 3650 -storepass "$PASS" -keypass "$PASS" -dname "CN=TV Max, O=wushisan"
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          echo "build-tools: $BT"
          UNSIGNED=$(grep -i 'python' apk-list.txt | grep -i 'release' | head -1)
          if [ -z "$UNSIGNED" ]; then UNSIGNED=$(head -1 apk-list.txt); fi
          echo "unsigned: $UNSIGNED"
          $ANDROID_HOME/build-tools/$BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks tvmax.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out TVMax-Box-1.0-armeabi_v7a.apk aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs TVMax-Box-1.0-armeabi_v7a.apk | head -2
          $ANDROID_HOME/build-tools/$BT/aapt dump badging TVMax-Box-1.0-armeabi_v7a.apk | grep -E "package:|sdkVersion|native-code" || true
          ls -lh TVMax-Box-1.0-armeabi_v7a.apk
          } 2>&1 | tee sign.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVMaxBox-apk
          path: TVMax-Box-1.0-armeabi_v7a.apk

      - name: Dump build log to repo (always)
        if: always()
        run: |
          { [ -f build-full.log ] && tail -n 600 build-full.log; [ -f apk-list.txt ] && echo '=== APK LIST ===' && cat apk-list.txt; [ -f sign.log ] && echo '=== SIGN LOG ===' && cat sign.log; } > build-log.txt 2>/dev/null || true
          if [ -s build-log.txt ]; then
            { echo '## Box build log tail'; echo '```'; cat build-log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
            git config user.email "ci@tvmax.local" || true
            git config user.name "tvmax-ci" || true
            git add build-log.txt || true
            git commit -m "ci: box build log" || true
            git pull --rebase origin fongmi || true
            git push origin HEAD:fongmi || true
          fi

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TVMaxBox-apk

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: verify
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p verify-out
            echo "=== install ===" > verify-out/steps.log
            adb install -r TVMax-Box-1.0-armeabi_v7a.apk >> verify-out/steps.log 2>&1 || adb install --abi armeabi-v7a -r TVMax-Box-1.0-armeabi_v7a.apk >> verify-out/steps.log 2>&1 || echo INSTALL_FAILED >> verify-out/steps.log
            adb root || true
            sleep 3
            adb logcat -c || true
            adb logcat > verify-out/logcat.txt &
            LOGPID=$!
            echo "=== launch ===" >> verify-out/steps.log
            adb shell am start -n com.wushisan.tvmax/com.github.tvbox.osc.ui.activity.HomeActivity >> verify-out/steps.log 2>&1 || adb shell monkey -p com.wushisan.tvmax -c android.intent.category.LAUNCHER 1 >> verify-out/steps.log 2>&1 || true
            sleep 75
            adb exec-out screencap -p > verify-out/home1.png || true
            adb shell uiautomator dump /sdcard/home1.xml || true
            adb pull /sdcard/home1.xml verify-out/home1.xml || true
            adb shell input keyevent 20 || true
            sleep 2
            adb exec-out screencap -p > verify-out/home2.png || true
            adb shell dumpsys activity activities > verify-out/activities.txt 2>&1 || true
            kill $LOGPID || true
            echo "=== done ===" >> verify-out/steps.log

      - name: Commit verify output
        if: always()
        run: |
          git config user.email "ci@tvmax.local" || true
          git config user.name "tvmax-ci" || true
          git add verify-out || true
          git commit -m "ci: box verify output" || true
          git pull --rebase origin fongmi || true
          git push origin HEAD:fongmi || true
          ls -lh verify-out || true

  release:
    needs: [build, verify]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TVMaxBox-apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tvmax-box-1.0
          name: TV Max Box 1.0 (TVBoxOSC 系换底座版)
          body: |
            TV Max 换底座版：基于 takagen99/Box (TVBoxOSC 系, minSdk 21, 兼容 Android 5.1)
            - 改名 TV Max, 独立包名 com.wushisan.tvmax
            - 内置默认配置: 老刘 (234 站, 含网盘/磁力 + 直播 + 深色壁纸源), 装上即用
            - armeabi-v7a (32 位), 适配暴风 TV (Amlogic T962 / Android 5.1 / 2G 内存)
          files: TVMax-Box-1.0-armeabi_v7a.apk
